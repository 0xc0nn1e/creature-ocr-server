# Authentication happens on the host and is mounted in. `gcloud auth
# application-default login` needs a browser and writes into the host's own
# gcloud configuration, so it is never run inside the container: what it wrote
# there would disappear with the container, and there is nothing to open a
# browser with anyway. (6.3)
services:
  ocr:
    build: .
    image: creature-ocr-server:0.1.0
    # Read on this machine at start-up, never copied into a layer. Not
    # required, so the container starts without one and GET /v1/engines says
    # what is missing rather than the container refusing to exist.
    env_file:
      - path: .env
        required: false
    environment:
      # Where the SDK looks for what `gcloud auth application-default login`
      # left behind. Pointing it at the mount below means the container reads
      # the host's credentials and writes nothing of its own.
      CLOUDSDK_CONFIG: /gcloud
    ports:
      # HOST and PORT name the address you reach the server on, which is what
      # they already mean for `python -m creature_ocr_server`. Only this side
      # of the mapping moves: 8000 inside the container is what the CMD, the
      # EXPOSE and the HEALTHCHECK all name, and changing that would be three
      # more edits for a number nobody outside ever sees.
      #
      # The default is the loopback address on purpose. This server holds a
      # cloud credential and spends money per request, so publishing it on
      # every interface has to be a decision somebody makes rather than one
      # they inherit - which is what HOST=0.0.0.0 is. Set SERVER_API_KEY
      # before widening it: past this line the key is the only thing between
      # the network and a billed call.
      - "${HOST:-127.0.0.1}:${PORT:-8000}:8000"
    volumes:
      # The host's gcloud configuration, read-only. Put the directory gcloud
      # keeps it in into .env as GCLOUD_CONFIG_DIR, with forward slashes:
      #
      #   Windows        C:/Users/<you>/AppData/Roaming/gcloud
      #   macOS, Linux   /home/<you>/.config/gcloud
      #
      # It falls back to ./secrets, which holds no
      # application_default_credentials.json - so leaving it unset simply
      # means no ADC, which is what a deployment authenticating with a service
      # account key wants instead. Read-only because nothing here should ever
      # write to your gcloud configuration. (6.3)
      - ${GCLOUD_CONFIG_DIR:-./secrets}:/gcloud:ro
      # The other way: a service account key file, git-ignored, pointed at by
      # GOOGLE_APPLICATION_CREDENTIALS. Also read-only, also never in a layer.
      - ./secrets:/run/secrets:ro
    # Nothing in this container writes. The upload parser is configured to keep
    # a page in memory, and this is the second half of that: a page that
    # somehow spilled would land in RAM and disappear with the container.
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
